# A: portable download/restore tests (stdlib + pytest, small local archives, no real model).
#    Runs for PRs and pushes to master that touch the loader, its tests, the files whose
#    checked-out bytes it verifies, dependencies or this workflow; also on manual runs.
#    No required status checks exist for master, so skipped runs cannot block a merge. If
#    this job is ever made required, drop the path filters first: a filtered-out PR would wait
#    for the check forever.
# B: the real RuBERT archive from Google Drive is downloaded, verified, restored, loaded and used
#    for predictions, then the full offline test suite runs. B is expensive and starts only on
#    a manual run (Actions -> "Model portability" -> Run workflow; the workflow must be on the
#    default branch, any branch can then be selected).
#    The workflow only reads the repository and never pushes, so it cannot re-trigger itself.
#    Third-party actions are pinned to full commit SHAs (tag in the trailing comment).
name: Model portability

on:
  pull_request:
    paths:
      - ".github/workflows/model-portability.yml"
      - ".gitattributes"
      - "pyproject.toml"
      - "requirements.txt"
      - "tools/fetch_transformer.py"
      - "tools/transformer_bundle.py"
      - "tests/test_fetch_transformer.py"
      - "configs/transformer.json"
      - "configs/transformer_bundle.json"
      - "src/train_transformer.py"
      - "reports/transformer/run_metadata.json"
      - "reports/baseline/run_metadata.json"
      - "reports/baseline/train_ids.csv"
      - "reports/data_prep/audit.json"
      - "reports/data_prep/split_ids.csv"
  push:
    branches: [master]
    paths:
      - ".github/workflows/model-portability.yml"
      - ".gitattributes"
      - "pyproject.toml"
      - "requirements.txt"
      - "tools/fetch_transformer.py"
      - "tools/transformer_bundle.py"
      - "tests/test_fetch_transformer.py"
      - "configs/transformer.json"
      - "configs/transformer_bundle.json"
      - "src/train_transformer.py"
      - "reports/transformer/run_metadata.json"
      - "reports/baseline/run_metadata.json"
      - "reports/baseline/train_ids.csv"
      - "reports/data_prep/audit.json"
      - "reports/data_prep/split_ids.csv"
  workflow_dispatch:
    inputs:
      real_model:
        description: "Download the real RuBERT archive and verify it; run the full test suite"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  portable:
    name: "A: loader / ${{ matrix.os }} / Python ${{ matrix.python }}"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # x86_64 Linux and Windows, ARM64 Linux, Apple Silicon (macos-latest) and Intel macOS.
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest, macos-15-intel]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Platform
        run: python -c "import platform, sys; print(platform.platform(), platform.machine(), sys.version)"
      - run: python -m pip install pytest==8.4.2
      - run: python -m pytest tests/test_fetch_transformer.py -v -p no:cacheprovider

  real-model:
    name: "B: real RuBERT / ${{ matrix.os }}"
    if: github.event_name == 'workflow_dispatch' && inputs.real_model
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    # One expensive run per OS at a time across all branches; a newer request waits instead
    # of cancelling (GitHub keeps at most one waiting run per group).
    concurrency:
      group: real-model-${{ matrix.os }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      max-parallel: 1  # one Google Drive download at a time
      matrix:
        # macOS Intel is absent: PyTorch publishes no macOS x86_64 wheels for torch 2.10.0.
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest]
    env:
      HF_HUB_OFFLINE: "1"
      PYTHONIOENCODING: utf-8  # readable Russian messages in CI logs (stdio only)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: "1. Platform"
        run: python -c "import platform, sys; print(platform.platform(), platform.machine(), sys.version)"
      # Linux: the PyTorch CPU index avoids multi-GB CUDA wheels. Windows and macOS: PyPI,
      # whose torch 2.10.0 wheels are CPU builds there (MPS on Apple Silicon).
      - name: "1. Install dependencies (Linux, PyTorch CPU index)"
        if: runner.os == 'Linux'
        run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
      - name: "1. Install dependencies (Windows/macOS, PyPI)"
        if: runner.os != 'Linux'
        run: python -m pip install -r requirements.txt
      - name: "1. PyTorch check"
        run: python -c "import torch, transformers, tokenizers; print('torch', torch.__version__, 'cuda', torch.cuda.is_available(), 'mps', torch.backends.mps.is_available(), 'transformers', transformers.__version__, 'tokenizers', tokenizers.__version__)"
      - name: "2-3. Download, verify and restore the model"
        run: python tools/fetch_transformer.py
      - name: "2-3. Archive is a tar of the expected size and SHA-256; bundle matches metadata"
        shell: python
        run: |
          import json, sys, tarfile
          from pathlib import Path
          sys.path.insert(0, "tools")
          import transformer_bundle as tb
          source = json.loads(Path("configs/transformer_bundle.json").read_text(encoding="utf-8"))
          archive = Path(source["download_dir"]) / source["archive_name"]
          assert not archive.read_bytes()[:512].lstrip().lower().startswith((b"<!doctype", b"<html")), "HTML"
          assert tarfile.is_tarfile(archive), "not a tar archive"
          assert archive.stat().st_size == source["size_bytes"], archive.stat().st_size
          assert tb.sha256_file(archive) == source["sha256"], "archive SHA-256"
          expected = tb.expected_files(Path("."), "reports/transformer")
          tb.check_directory(Path("models/transformer"), expected)
          stamps = {str(p): p.stat().st_mtime_ns for p in [archive, *Path("models/transformer").iterdir()]}
          Path("stamps.json").write_text(json.dumps(stamps), encoding="utf-8")
          print(f"archive {archive.stat().st_size} bytes, SHA-256 OK; {len(expected)} bundle files OK")
      - name: "3. Second run must not download or rewrite anything"
        run: python tools/fetch_transformer.py
      - name: "3. Files unchanged after the second run"
        shell: python
        run: |
          import json
          from pathlib import Path
          stamps = json.loads(Path("stamps.json").read_text(encoding="utf-8"))
          changed = [p for p, t in stamps.items() if Path(p).stat().st_mtime_ns != t]
          assert not changed, changed
          assert not list(Path("artifacts/downloads").glob("*.partial"))
          print(f"{len(stamps)} files unchanged, nothing downloaded")
      - name: "4. Verify the model (class order, fixed texts, full validation)"
        run: |
          python tools/restore_nlp_splits.py
          python tools/verify_transformer.py --full-validation --output verification-${{ matrix.os }}.json
      - name: "4. Predict fixed texts"
        run: python -m src.train_transformer --verify-bundle models/transformer
      - name: "5. Full offline test suite"
        run: python -m pytest -q -rfE -p no:cacheprovider --junitxml=pytest-${{ matrix.os }}.xml
      - name: "5. Report failed tests as annotations"
        if: failure()
        shell: python
        run: |
          import xml.etree.ElementTree as ET
          from pathlib import Path
          report = Path("pytest-${{ matrix.os }}.xml")
          if report.exists():
              for case in ET.parse(report).iter("testcase"):
                  for bad in [*case.iter("failure"), *case.iter("error")]:
                      message = (bad.get("message") or "").replace("\n", " ")[:300]
                      print(f"::error title={case.get('classname')}.{case.get('name')}::{message}")
      # Only JSON/XML reports: no weights, archives or review texts are uploaded.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: verification-${{ matrix.os }}
          path: |
            verification-${{ matrix.os }}.json
            pytest-${{ matrix.os }}.xml
          if-no-files-found: ignore
